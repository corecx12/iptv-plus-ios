name: Emulator-Test (Fire TV)

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Debug-APK bauen (mit x86_64 für den Emulator)
        working-directory: android
        env:
          EXTRA_ABI: x86_64
        run: gradle assembleDebug --no-daemon -q
      - name: KVM aktivieren
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Testserver starten
        run: nohup python3 .github/test/mock_xtream.py 8080 > mock.log 2>&1 &
      - name: Emulator starten und App testen
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: tv_1080p
          ram-size: 2048M
          heap-size: 256M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: bash .github/test/run_emulator.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-ergebnis
          path: |
            emu-out
            mock.log

name: APK bauen (Fire TV)

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Signierschlüssel aus Geheimnis
        env:
          S1: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          S2: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          # Leerzeichen/Zeilenumbrüche vom Einfügen entfernen; vertauschte Werte erkennen
          A=$(printf '%s' "$S1" | tr -d ' \r\n\t')
          B=$(printf '%s' "$S2" | tr -d ' \r\n\t')
          echo "Länge Geheimnis 1: ${#A}, Länge Geheimnis 2: ${#B} (erwartet ca. 3516 und 32)"
          KS="$RUNNER_TEMP/release.keystore"
          if printf '%s' "$A" | base64 -d > "$KS" 2>/dev/null && [ "$(stat -c%s "$KS")" -gt 1000 ]; then PW="$B"
          elif printf '%s' "$B" | base64 -d > "$KS" 2>/dev/null && [ "$(stat -c%s "$KS")" -gt 1000 ]; then PW="$A"; echo "Hinweis: Geheimnisse waren vertauscht"
          else echo "::error::Signierschlüssel unlesbar – ANDROID_KEYSTORE_B64 bitte neu eintragen"; exit 1; fi
          echo "::add-mask::$PW"
          echo "KEYSTORE_PASSWORD=$PW" >> "$GITHUB_ENV"
          keytool -list -keystore "$KS" -storepass "$PW" >/dev/null || { echo "::error::Passwort passt nicht zum Schlüssel – ANDROID_KEYSTORE_PASSWORD bitte prüfen"; exit 1; }

      - name: APK bauen
        working-directory: android
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
        run: |
          set +e
          gradle assembleRelease --no-daemon --stacktrace > build.log 2>&1
          rc=$?
          tail -5 build.log
          if [ $rc -ne 0 ]; then grep -E "^e: |error:|FAILURE|What went wrong" -A3 build.log | head -80; exit 1; fi

      - name: APK umbenennen
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk IPTVPlus-FireTV.apk
          ls -la IPTVPlus-FireTV.apk

      - name: Als Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "firetv-${{ github.run_number }}" IPTVPlus-FireTV.apk \
            --title "IPTV+ für Fire TV (Build ${{ github.run_number }})" \
            --notes "APK für Fire TV Stick – per Downloader-App oder adb installieren. Gebaut von CoreCX."

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-build-log
          path: android/build.log
          if-no-files-found: ignore

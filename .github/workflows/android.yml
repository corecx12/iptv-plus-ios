name: APK bauen (Fire TV)

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Signierschlüssel entschlüsseln
        env:
          S2: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          # Schlüssel liegt verschlüsselt im Projekt; das Passwort kommt aus dem GitHub-Geheimnis
          PW=$(printf '%s' "$S2" | tr -d ' \r\n\t')
          echo "::add-mask::$PW"
          KS="$RUNNER_TEMP/release.keystore"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in android/app/release.keystore.enc -out "$KS" -pass "pass:$PW" \
            || { echo "::error::Passwort-Geheimnis ANDROID_KEYSTORE_PASSWORD passt nicht"; exit 1; }
          keytool -list -keystore "$KS" -storepass "$PW" >/dev/null || { echo "::error::Schlüssel/Passwort passen nicht zusammen"; exit 1; }
          echo "KEYSTORE_PASSWORD=$PW" >> "$GITHUB_ENV"

      - name: APK bauen
        working-directory: android
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
        run: |
          set +e
          gradle assembleRelease --no-daemon --stacktrace > build.log 2>&1
          rc=$?
          tail -5 build.log
          if [ $rc -ne 0 ]; then grep -E "^e: |error:|FAILURE|What went wrong" -A3 build.log | head -80; exit 1; fi

      - name: APK umbenennen
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk IPTVPlus-FireTV.apk
          ls -la IPTVPlus-FireTV.apk

      - name: Als Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "firetv-${{ github.run_number }}" IPTVPlus-FireTV.apk \
            --title "Build ${{ github.run_number }} - CoreCX" \
            --notes "APK für Fire TV Stick – per Downloader-App oder adb installieren. Gebaut von CoreCX."

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-build-log
          path: android/build.log
          if-no-files-found: ignore
